<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>BK BHAI</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020202}
body{overflow-x:hidden;font-family:Arial,sans-serif}
.stage{min-height:100svh;display:grid;place-items:center;background:#020202}
.poster{position:relative;width:min(100vw,486px);aspect-ratio:9/16;overflow:hidden;background:#070707}
.poster-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dp-wrap{position:absolute;z-index:8;left:50%;top:31.6%;width:58.5%;aspect-ratio:1;transform:translateX(-50%);animation:float 3.6s infinite ease-in-out}
.dp-image{width:100%;height:100%;border-radius:50%;object-fit:cover}
.dp-glow{position:absolute;inset:-5%;border-radius:50%;background:radial-gradient(circle,rgba(255,218,106,.4),transparent 70%);filter:blur(10px)}
.telegram-hit{position:absolute;z-index:12;left:11%;top:76%;width:78%;height:7%;border-radius:22px;cursor:pointer}
.button-shine{position:absolute;top:-20%;left:-38%;width:28%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-22deg);animation:shine 3s infinite}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd66a;box-shadow:0 0 12px #ffd66a;animation:sparkle 3s infinite}
.spark-1{left:14%;top:34%}
.spark-2{left:84%;top:29%;animation-delay:.7s}
.spark-3{left:17%;top:67%;animation-delay:1s}
.spark-4{left:88%;top:70%;animation-delay:1.5s}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}
@keyframes shine{0%{left:-38%}100%{left:128%}}
@keyframes sparkle{0%,100%{opacity:0}50%{opacity:1}}
@media(min-width:700px){.poster{height:min(94vh,900px);width:auto;max-width:506px}}
</style>

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){
if(f.fbq)return;n=f.fbq=function(){
n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)
}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init','YOUR_PIXEL_ID');
fbq('track','PageView');
</script>
</head>

<body>
<main class="stage">
<div class="poster">

<img class="poster-image"
src="assets/bk-bhai-style-1.png">

<div class="dp-wrap">
<div class="dp-glow"></div>
<img class="dp-image"
src="assets/bk-bhai-dp.png">
</div>

<div class="spark spark-1"></div>
<div class="spark spark-2"></div>
<div class="spark spark-3"></div>
<div class="spark spark-4"></div>

<a class="telegram-hit"
href="https://t.me/YOUR_CHANNEL"
target="_blank"
rel="noopener"
onclick="if(window.fbq)fbq('track','Lead');">
<span class="button-shine"></span>
</a>

</div>
</main>
</body>
</html>
